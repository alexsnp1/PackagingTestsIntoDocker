  name: Run tests

  # Триггер
  on: [push, workflow_dispatch]

  jobs: # аналог этапов
    run-tests:
      name: Set up services (review apps) and run tests
      runs-on: ubuntu-latest

      steps: # шаги конкретной джобы
        - name: Checkout repository # копируем файлы репозитория внутрь CI раннера
          uses: actions/checkout@v4

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'

        # Кешируем зависимости Maven.
        # Если pom.xml изменится — изменится hash и кеш будет создан заново.
        - name: Cache Maven repository
          uses: actions/cache@v4
          with:
            path: ~/.m2/repository
            key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            restore-keys: |
              ${{ runner.os }}-maven-

        - name: Set up services
          run: bash infra/docker_compose/restart_docker.sh

        - name: Run tests
          run: ./mvnw clean test
